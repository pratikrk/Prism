[project]
name = "prism-api"
version = "0.0.0"
description = "Prism API — FastAPI + Celery agent runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "httpx>=0.27",
  "tenacity>=9.0",
  "anthropic>=0.40",
  "sentry-sdk[fastapi,celery]>=2.18",
  "pyjwt[crypto]>=2.9",
  "python-dotenv>=1.0",
  "orjson>=3.10",
  "structlog>=24.4",
  "flower>=2.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
  "respx>=0.21",
  "fakeredis>=2.26",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-redis",
  "psycopg[binary]>=3.2",
  "celery[pytest]>=5.4",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"
markers = [
  "integration: requires Postgres + Redis",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
