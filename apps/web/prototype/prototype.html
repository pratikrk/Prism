<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Prism · SEO Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0a0b;font-family:'Inter',system-ui,sans-serif;overflow:hidden}

:root{
  --bg:#0a0a0b;--bg-elev:#0f0f11;--bg-card:#111114;--bg-hover:#17171b;
  --border:#1f1f24;--border-strong:#2a2a31;
  --text:#ededf0;--text-mut:#8a8a93;--text-dim:#55555d;
  --accent:#7c5cff;--accent-dim:rgba(124,92,255,0.14);--accent-hover:#9171ff;
  --ok:#3ecf8e;--ok-dim:rgba(62,207,142,0.12);
  --warn:#f5a524;--warn-dim:rgba(245,165,36,0.12);
  --err:#ff5b5b;--err-dim:rgba(255,91,91,0.12);
  --running:#5b8dff;--running-dim:rgba(91,141,255,0.14);
}
.light{
  --bg:#fafaf8;--bg-elev:#ffffff;--bg-card:#ffffff;--bg-hover:#f4f4f1;
  --border:#e8e8e4;--border-strong:#d6d6d1;
  --text:#111114;--text-mut:#6b6b73;--text-dim:#9a9aa2;
  --accent:#6544ff;--accent-dim:rgba(101,68,255,0.10);--accent-hover:#4f35cc;
  --ok:#14a564;--ok-dim:rgba(20,165,100,0.10);
  --warn:#c77700;--warn-dim:rgba(199,119,0,0.10);
  --err:#d9342b;--err-dim:rgba(217,52,43,0.10);
  --running:#3d6bd9;--running-dim:rgba(61,107,217,0.10);
}

#root{height:100%;display:flex;flex-direction:column}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:0}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}

/* scrollbars */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:2px}
::-webkit-scrollbar-track{background:transparent}

/* grid bg */
.grid-bg{
  background-image:radial-gradient(circle,rgba(255,255,255,0.03) 1px,transparent 1px);
  background-size:28px 28px;
}
.light .grid-bg{
  background-image:radial-gradient(circle,rgba(0,0,0,0.04) 1px,transparent 1px);
}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes stream{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes progressFill{from{width:0%}to{width:var(--target-width,80%)}}

.pulse-dot{animation:pulse 1.5s ease-in-out infinite}
.spin{animation:spin .9s linear infinite;display:inline-block}
.fade-up{animation:fadeUp .3s ease forwards}
.caret::after{content:'';display:inline-block;width:7px;height:1em;background:var(--accent);margin-left:2px;vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="proto-primitives.jsx"></script>
<script type="text/babel" src="proto-screens.jsx"></script>
<script type="text/babel" src="proto-results.jsx"></script>
<script type="text/babel" src="proto-app.jsx"></script>
</body>
</html>
